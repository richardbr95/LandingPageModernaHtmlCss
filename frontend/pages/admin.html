<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/admin.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="landing.html" class="logo" aria-label="Dashboard">
          MinhaMarca
        </a>

        <nav
          id="main-nav"
          class="main-nav"
          aria-label="Navegação administrativa"
        >
          <ul>
            <li>
              <a href="index.html">Dashboard</a>
            </li>

            <li>
              <a href="contacts.html">Contatos</a>
            </li>

            <li>
              <button id="logout-button" class="btn btn-ghost">Sair</button>
            </li>
          </ul>
        </nav>

        <button
          class="nav-toggle"
          aria-controls="main-nav"
          aria-expanded="false"
          aria-label="Abrir menu"
        >
          <span class="hamburger" aria-hidden="true">☰</span>
        </button>
      </div>
    </header>

    <main class="admin-main">
      <div class="container">
        <div class="admin-header">
          <div>
            <p class="admin-eyebrow">PAINEL ADMINISTRATIVO</p>
            <h1 class="admin-title">Dashboard</h1>
            <p class="admin-subtitle">
              Gerencie e acompanhe os contatos recebidos.
            </p>
          </div>
        </div>

        <section class="dashboard container">
          <h1 class="section-title">Dashboard</h1>

          <div class="dashboard-welcome">
            <h2>Bem-vindo, <span id="user-name"></span>!</h2>
            <p>Confira um resumo das informações do sistema.</p>
          </div>

          <div class="dashboard-cards">
            <article class="dashboard-card">
              <h3>Contatos</h3>
              <strong id="contacts-count">0</strong>
              <p>contatos recebidos</p>
            </article>
          </div>
        </section>
      </div>
    </main>
    <script src="../js/auth.js"></script>
    <script src="../js/admin.js"></script>
  </body>
</html>
