<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Usuários</title>

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/admin.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="landing.html" class="logo" aria-label="Dashboard">
          MinhaMarca
        </a>

        <nav
          id="main-nav"
          class="main-nav"
          aria-label="Navegação administrativa"
        >
          <ul>
            <li>
              <a href="admin.html">Dashboard</a>
            </li>

            <li>
              <a href="contacts.html">Contatos</a>
            </li>

            <li>
              <a href="users.html">Usuários</a>
            </li>
            <div class="theme-picker">
              <button
                class="theme-picker-btn"
                id="theme-picker-btn"
                aria-label="Trocar tema"
              >
                🎨
              </button>
              <div class="theme-popup" id="theme-popup">
                <button class="theme-option" onclick="applyTheme('blue')">
                  🔵 AzulV
                </button>
                <button class="theme-option" onclick="applyTheme('green')">
                  🟢 VerdeV
                </button>
                <button class="theme-option" onclick="applyTheme('red')">
                  🔴 PretoVR
                </button>
              </div>
            </div>

            <li>
              <button id="logout-button" class="btn btn-ghost">Sair</button>
            </li>
          </ul>
        </nav>

        <button
          class="nav-toggle"
          aria-controls="main-nav"
          aria-expanded="false"
          aria-label="Abrir menu"
        >
          <span class="hamburger" aria-hidden="true">☰</span>
        </button>
      </div>
    </header>

    <main class="admin-main">
      <div class="container">
        <div class="admin-header">
          <div>
            <p class="admin-eyebrow">PAINEL ADMINISTRATIVO</p>
            <h1 class="admin-title">Usuários</h1>
            <p class="admin-subtitle">
              Lista de todos os usuários cadastrados.
            </p>
          </div>
        </div>

        <section class="dashboard container">
          <div class="contacts-panel">
            <div class="panel-header">
              <div>
                <h2>Lista de Usuárioss</h2>
                <p>Gerencie os usuários recebidos</p>
              </div>
            </div>

            <div class="search-wrapper">
              <input
                type="text"
                id="search-input"
                class="search-input"
                placeholder="Buscar por nome..."
              />
            </div>
            <div class="table-wrapper">
              <table class="contacts-table">
                <thead>
                  <tr>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Perfil</th>
                    <th>Ações</th>
                  </tr>
                </thead>
                <tbody id="users-table-body">
                  <!-- linhas preenchidas via JS -->
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
      <script src="../js/config.js"></script>
      <script src="../js/theme.js"></script>
      <script src="../js/auth.js"></script>
      <script src="../js/users.js"></script>
    </main>
  </body>
</html>
