<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Contatos</title>

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/admin.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="landing.html" class="logo" aria-label="Dashboard">
          MinhaMarca
        </a>

        <nav
          id="main-nav"
          class="main-nav"
          aria-label="Navegação administrativa"
        >
          <ul>
            <li>
              <a href="admin.html">Dashboard</a>
            </li>

            <li>
              <a href="contacts.html">Contatos</a>
            </li>

            <li>
              <button id="logout-button" class="btn btn-ghost">Sair</button>
            </li>
          </ul>
        </nav>

        <button
          class="nav-toggle"
          aria-controls="main-nav"
          aria-expanded="false"
          aria-label="Abrir menu"
        >
          <span class="hamburger" aria-hidden="true">☰</span>
        </button>
      </div>
    </header>

    <main class="admin-main">
      <div class="container">
        <div class="admin-header">
          <div>
            <p class="admin-eyebrow">PAINEL ADMINISTRATIVO</p>
            <h1 class="admin-title">Contatos</h1>
            <p class="admin-subtitle">Lista completa de contatos recebidos.</p>
          </div>
        </div>

        <section class="dashboard container">
          <div class="table-wrapper">
            <table class="contacts-table">
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>E-mail</th>
                  <th>Mensagem</th>
                </tr>
              </thead>
              <tbody id="contacts-table-body">
                <!-- linhas preenchidas via JS -->
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
    <script src="../js/auth.js"></script>
    <script src="../js/contacts.js"></script>
  </body>
</html>
