<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="../pages/landing.html" class="logo" aria-label="Página inicial"
          >MinhaMarca</a
        >

        <!-- Navegação principal -->
        <nav id="main-nav" class="main-nav" aria-label="Navegação principal">
          <ul>
            <li>
              <a href="landing.html" class="btn btn-ghost">Voltar</a>
            </li>
          </ul>
        </nav>

        <!-- Botão para menu mobile (controlado por JS) -->
        <button
          class="nav-toggle"
          aria-controls="main-nav"
          aria-expanded="false"
          aria-label="Abrir menu"
        >
          <span class="hamburger" aria-hidden="true">☰</span>
        </button>
      </div>
    </header>

    <main>
      <section id="login-page" class="login container">
        <h2 class="section-title">Login</h2>
        <form id="login-form" action="#" method="post" novalidate>
          <div class="form-row">
            <input
              type="email"
              name="email"
              placeholder="Seu e‑mail"
              required
            />
            <input
              type="password"
              name="password"
              placeholder="Sua senha"
              required
            />
          </div>
          <button type="submit" class="btn btn-primary">Entrar</button>
        </form>
        <p id="login-message"></p>
      </section>

      <script src="../js/login.js"></script>
    </main>
  </body>
</html>
